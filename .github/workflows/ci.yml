name: CI

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/check_conventional_commit.py "$PR_TITLE" --body "$PR_BODY"

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-prod.lock -r requirements-test.lock
          npm ci
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; from pathlib import Path; import os; p=sync_playwright().start(); Path(os.environ['GITHUB_ENV']).open('a').write('PHR_BROWSER_EXECUTABLE=' + p.chromium.executable_path + '\n'); p.stop()"
      - name: Verify repository contracts
        run: |
          python tools/verify_release_automation.py
          python tools/release_version.py check
          python tools/verify_documentation.py
          python tools/verify_traceability.py
          python tools/verify_release_gate.py
      - name: Verify Django state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run Python tests
        run: python -m pytest -q -m "not postgres and not ocr_model" --ignore=tests/browser/test_ac02_upload_browser.py --ignore=tests/browser/test_upload_interactions_browser.py --ignore=tests/browser/test_cloud_sources_browser.py --ignore=tests/browser/test_cloud_open_browser.py --ignore=tests/browser/test_cloud_selected_output_browser.py --ignore=tests/browser/test_molecular_browser.py --ignore=tests/browser/test_molecular_outputs_browser.py --ignore=tests/browser/test_molecular_combined_browser.py
      - name: Run required browser regressions
        run: python tools/run_required_tests.py -q tests/browser/test_ac02_upload_browser.py tests/browser/test_upload_interactions_browser.py tests/browser/test_cloud_sources_browser.py tests/browser/test_cloud_open_browser.py tests/browser/test_cloud_selected_output_browser.py tests/browser/test_molecular_browser.py tests/browser/test_molecular_outputs_browser.py tests/browser/test_molecular_combined_browser.py
      - name: Run JavaScript tests
        run: npm run test:js
      - name: Evaluate parser and dictionary snapshot on frozen public corpus
        if: always()
        run: python tools/phase_two_evaluation.py --synthetic-only --report artifacts/phase-two-release-evaluation.json
      - name: Archive parser evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-two-evaluation-${{ github.sha }}
          path: artifacts/phase-two-release-evaluation.json
          if-no-files-found: error

  postgres-concurrency:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      DJANGO_SETTINGS_MODULE: config.settings.postgres_test
      PHR_POSTGRES_TEST_URL: postgresql://phr_test:synthetic-ci-only@127.0.0.1:5432/phr_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: phr_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: phr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phr_test -d phr_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-prod.lock -r requirements-test.lock
      - name: Run required PostgreSQL concurrency regressions
        run: python tools/run_required_tests.py -q --ds=config.settings.postgres_test -m postgres tests

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production image with locked dependencies
        run: docker build --file deploy/Dockerfile --tag family-phr:ci .
      - name: Verify image runs as its unprivileged user
        run: docker run --rm --env DJANGO_SETTINGS_MODULE=config.settings.build --entrypoint python family-phr:ci -c "import os; assert os.getuid() == 10001; import django, celery, pypdfium2; from apps.exports.files import private_temporary_file; output=private_temporary_file(); output.write(b'synthetic-export-probe'); output.close(); print('Production image imports and private export temp write verified')"
