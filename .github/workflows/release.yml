name: Automatic release

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The candidate runs the full suite; leave setup time beyond the 90-minute gate.
    timeout-minutes: 100
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out the trusted release workflow revision
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for candidate CI and Squash merge
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: python tools/merge_release_pr.py
