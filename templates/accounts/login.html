{% load static %}<!doctype html><html lang="zh-Hans"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{% static 'css/tokens.css' %}"><link rel="stylesheet" href="{% static 'css/public.css' %}"></head><body><a href="#main">跳到主要内容</a><main id="main"><h1>登录</h1><p>用手机号接收验证码，轻松开始整理家庭健康资料。</p>{% if message %}<p role="status">{{ message }}</p>{% endif %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login/request-code/">{% csrf_token %}{{ phone_form.next }}<label for="id_phone">手机号</label>{{ phone_form.phone }}<button data-countdown>获取验证码</button></form><form method="post" action="/login/verify/">{% csrf_token %}{{ verify_form.next }}<label for="id_phone">手机号</label>{{ verify_form.phone }}<label for="id_code">验证码</label>{{ verify_form.code }}<button>登录</button></form><a href="#privacy">隐私政策</a><p id="privacy">我们重视您的隐私。</p></main><script src="{% static 'js/login.js' %}"></script></body></html>
