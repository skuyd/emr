{% extends "base_public.html" %}
{% block title %}忘记密码｜家庭健康资料{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="forgot-password-title">
  <h1 id="forgot-password-title">重置密码</h1>
  <p>输入手机号以继续。</p>
  {% if status %}<p role="status">{{ status }}</p>{% endif %}
  <form method="post" action="{% url 'accounts:forgot_password' %}" novalidate>
    {% csrf_token %}
    <div class="field"><label for="id_phone">手机号</label>{{ form.phone }}</div>
    <div class="actions"><button type="submit">发送验证码</button></div>
  </form>
  <p><a href="{% url 'accounts:login' %}">返回登录</a></p>
</section>
{% endblock %}
