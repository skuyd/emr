{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}家庭健康资料{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app-shell.css' %}">
</head>
<body class="app-body">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="app-header">
    <a class="app-brand" href="/">家庭健康资料</a>
    <p class="app-patient-name">{{ request.patient.display_name }}</p>
    <form method="post" action="/logout/">
      {% csrf_token %}
      <button class="logout-button" type="submit">退出登录</button>
    </form>
  </header>
  <aside class="app-sidebar" aria-label="应用导航">
    <nav aria-label="主要导航">
      <ul class="app-nav-list">
        <li><a href="/"{% if current_section == "home" %} aria-current="page"{% endif %}>首页</a></li>
        <li><a href="/records/"{% if current_section == "records" %} aria-current="page"{% endif %}>病案</a></li>
        <li><a href="/me/"{% if current_section == "profile" %} aria-current="page"{% endif %}>我的</a></li>
        <li><a href="/tasks/"{% if current_section == "tasks" %} aria-current="page"{% endif %}>任务</a></li>
      </ul>
    </nav>
    <section class="app-task-status" aria-labelledby="task-status-title">
      <h2 id="task-status-title">任务状态</h2>
      <p>暂未安排待办事项。</p>
      <a href="/tasks/">查看任务状态</a>
    </section>
  </aside>
  <main id="main-content" tabindex="-1" class="app-main">
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/app-shell.js' %}"></script>
</body>
</html>
