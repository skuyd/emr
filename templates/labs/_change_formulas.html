<details class="trend-formulas"><summary>个人变化的计算方式</summary>
  <p>上次变化 = 本次 − 上次；百分比 =（本次 − 基准）÷ 基准 × 100%；每天变化 =（本次 − 上次）÷ 实际相隔天数。</p>
  <p>个人均值取本次之前最近三次有效记录，可能早于筛选日期；不含本次。同日多份、样本不足、零或负基准、来源依据不足时，不计算相应百分比。</p>
  <p>一般指标偏离均值超过 30%、肿瘤标志物超过 50% 时显示淡色提示，仅描述个人数值变化。</p>
  <p>变化值通常显示到小数点后两位，提示按未取整数值判断；原报告值保留原样。</p>
</details>
