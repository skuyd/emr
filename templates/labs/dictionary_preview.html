{% extends 'labs/base.html' %}{% block labs_content %}<h1>发布前差异与固定回归</h1><pre>{{ preview_json }}</pre>{% if preview.regression_report.passed %}<form method="post" action="{% url 'labs:dictionary_publish' %}">{% csrf_token %}{% include 'components/_patient_scope.html' %}<input type="hidden" name="version" value="{{ version }}"><input type="hidden" name="expected_active_hash" value="{{ preview.expected_active_hash }}"><input type="hidden" name="expected_preview_hash" value="{{ preview.preview_hash }}">{% for identity in candidate_ids %}<input type="hidden" name="candidate_ids" value="{{ identity }}">{% endfor %}<button>发布 {{ version }}</button></form>{% else %}<p role="alert">固定回归未通过，当前候选不能发布。</p>{% endif %}{% endblock %}
