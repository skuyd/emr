{% if data.kind == 'SYMPTOM' %}<p class="visit-text">{{ data.symptom_name }}{% if data.severity %} · {{ data.severity }}{% endif %}</p>
{% elif data.kind == 'ECOG' %}<p class="visit-text">{{ data.score }} 分</p>
{% else %}<p class="visit-text">{{ data.raw_value }} {{ data.raw_unit }}</p>{% endif %}
<p>{{ data.local_time }}</p>
