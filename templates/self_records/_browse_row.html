{% load patient_urls %}
<details class="self-record-entry"><summary><span class="self-record-icon-tile">{% include 'self_records/_kind_icon.html' with kind=row.record.kind only %}</span><span class="self-record-result"><span class="self-record-meta">{{ row.kind_label }}{% if row.time %}<time>{{ row.time }}</time>{% endif %}</span><span class="self-record-value">{{ row.label }}</span></span><span class="self-record-chevron" aria-hidden="true">›</span></summary><div class="self-record-expanded"><p>{{ row.display_time }}</p>{% if can_write %}<a class="button button--text" href="{% patient_url 'self_records:edit' row.record.pk %}&amp;view={{ view_mode }}">更正记录</a>{% endif %}</div></details>
