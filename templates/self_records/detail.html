{% extends "self_records/base.html" %}
{% load patient_urls %}
{% block record_content %}
<h1>{{ row.kind_label }}记录</h1>
<section class="visit-panel" aria-labelledby="current-record"><h2 id="current-record">当前内容</h2>
{% include 'self_records/_value.html' with data=record.current_data only %}
{% if can_write %}<a class="button button--secondary" href="{% patient_url 'self_records:edit' record.pk %}">更正记录</a>{% endif %}
</section>
<a class="button button--secondary" href="{% patient_url 'self_records:index' %}">返回列表</a>
{% endblock %}
