{% if name == "brand" %}
<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
  <path d="M5 5.5h5l1.5 2H19v11H5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>

</svg>
{% elif name == "processing" %}

{% elif name == "organized" %}
