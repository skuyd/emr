  <header class="dr-chrome">
    <div class="dr-brand"><span class="dr-brand-mark"><i data-lucide="heart-pulse" aria-hidden="true"></i></span><span class="dr-brand-name">健康之家</span></div>
    <div class="dr-nav" aria-label="应用导航示意"><span>首页</span><span>健康档案</span><span class="dr-nav-optional">健康趋势</span><span class="dr-nav-current">日常记录</span><span class="dr-nav-optional">我的</span></div>
    <span class="dr-demo">交互原型 · 示例数据</span>
  </header>
  <main class="dr-main">
    <section data-screen="browse">
      <div class="dr-page-heading">
        <div><h1>日常记录</h1><p class="dr-subtitle">记录体重、体温、身体感受与 ECOG 评分。</p></div>
        <button class="dr-button dr-button-primary" type="button" data-action="new"><i data-lucide="plus" aria-hidden="true"></i>记一条</button>
      </div>
      <div class="dr-notice" role="status" data-notice hidden></div>
      <div class="dr-toolbar">
        <div class="dr-month-controls">
          <button class="dr-button dr-arrow" type="button" data-action="previous" aria-label="上个月"><span class="dr-month-arrow" aria-hidden="true">‹</span></button>
          <h2 class="dr-month-title" data-month-title></h2>
          <button class="dr-button dr-arrow" type="button" data-action="next" aria-label="下个月"><span class="dr-month-arrow" aria-hidden="true">›</span></button>
          <button class="dr-button" type="button" data-action="today">今天</button>
        </div>
        <div class="dr-display-controls">
          <select class="dr-filter" aria-label="筛选记录类型" data-filter><option value="all">全部类型</option><option value="weight">体重</option><option value="temperature">体温</option><option value="symptom">症状</option><option value="ecog">ECOG评分</option></select>
          <div class="dr-segment" role="group" aria-label="记录显示方式">
            <button type="button" data-view="calendar" aria-pressed="true"><i data-lucide="calendar-days" aria-hidden="true"></i>日历</button>
            <button type="button" data-view="list" aria-pressed="false"><i data-lucide="list" aria-hidden="true"></i>列表</button>
          </div>
        </div>
      </div>
      <div class="dr-layout" data-calendar-view>
        <section class="dr-calendar" data-calendar aria-label="记录月历">
          <div class="dr-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="dr-days" data-days role="group" aria-label="选择日期"></div>
          <div class="dr-calendar-foot"><span><span class="dr-today-key"></span>今天</span><span>点击日期查看当天记录</span><span data-month-count></span></div>
        </section>
        <section class="dr-day-panel" aria-label="所选日期记录" aria-live="polite" data-day-panel></section>
      </div>
      <section class="dr-list-panel" data-list-view aria-label="按日期分组的记录" hidden></section>
      <p class="dr-bottom-note" data-browse-note>显示用户填写的日期和时间。</p>
    </section>

    <section data-screen="form" hidden>
      <div class="dr-form-wrap">
        <button class="dr-button dr-button-text" type="button" data-action="cancel"><i data-lucide="arrow-left" aria-hidden="true"></i>返回列表</button>
        <div class="dr-form-heading"><h1 data-form-title>记一条</h1><p class="dr-subtitle" data-form-subtitle>记录此刻，也可以补记之前的情况。</p></div>
        <div class="dr-form-layout">
        <form class="dr-form-panel" data-record-form>
          <div class="dr-notice" role="status" data-form-notice hidden></div>
          <span class="dr-field-label" id="dr-type-label">记录类型</span>
          <div class="dr-type-options" role="group" aria-labelledby="dr-type-label">
            <button class="dr-type" type="button" data-kind="weight" aria-pressed="true"><span class="dr-type-check" aria-hidden="true">✓</span><i data-lucide="scale" aria-hidden="true"></i><span>体重</span></button>
            <button class="dr-type" type="button" data-kind="temperature" aria-pressed="false"><span class="dr-type-check" aria-hidden="true">✓</span><i data-lucide="thermometer" aria-hidden="true"></i><span>体温</span></button>
            <button class="dr-type" type="button" data-kind="symptom" aria-pressed="false"><span class="dr-type-check" aria-hidden="true">✓</span><i data-lucide="activity" aria-hidden="true"></i><span>症状</span></button>
            <button class="dr-type" type="button" data-kind="ecog" aria-pressed="false"><span class="dr-type-check" aria-hidden="true">✓</span><i data-lucide="clipboard-list" aria-hidden="true"></i><span>ECOG评分</span></button>
          </div>
          <div class="dr-field" data-time-field><label class="dr-field-label" for="dr-time">测量时间</label><input class="dr-input" id="dr-time" name="recordTime" type="datetime-local" step="60" required aria-describedby="dr-time-help"><p class="dr-field-help" id="dr-time-help">默认当前设备时间，可修改。</p></div>
          <div class="dr-field" data-date-field hidden><label class="dr-field-label" for="dr-date">日期</label><input class="dr-input" id="dr-date" name="recordDate" type="date" disabled aria-describedby="dr-date-help"><p class="dr-field-help" id="dr-date-help">默认当前设备日期，可修改。</p></div>
          <div class="dr-field" data-quantity-field><label class="dr-field-label" for="dr-value" data-value-label>体重</label><div class="dr-quantity"><input class="dr-input" id="dr-value" name="value" type="text" inputmode="decimal" required autocomplete="off" placeholder="例如 62.4"><select class="dr-input" id="dr-unit" name="unit" aria-label="单位"><option>kg</option><option>g</option><option>lb</option></select></div></div>
          <div data-symptom-fields hidden><div class="dr-field"><label class="dr-field-label" for="dr-symptom">症状名称</label><input class="dr-input" id="dr-symptom" name="symptom" type="text" maxlength="80" placeholder="例如头痛、乏力" disabled></div><div class="dr-field"><label class="dr-field-label" for="dr-severity">自述程度 <span class="dr-muted">（选填）</span></label><input class="dr-input" id="dr-severity" name="severity" type="text" maxlength="80" placeholder="例如轻微、不影响日常活动" disabled></div></div>
          <fieldset class="dr-grade-options" data-ecog-fields hidden disabled>
            <legend class="dr-field-label">ECOG评分等级</legend>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="0" required><span class="dr-grade-number">0 分</span><span class="dr-grade-description">活动正常，不受限制。</span></label>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="1" required><span class="dr-grade-number">1 分</span><span class="dr-grade-description">剧烈活动受限；可行走，能做轻体力或坐位工作。</span></label>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="2" required><span class="dr-grade-number">2 分</span><span class="dr-grade-description">能完全自理，但不能工作；清醒时间中超过一半可离床活动。</span></label>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="3" required><span class="dr-grade-number">3 分</span><span class="dr-grade-description">仅能部分自理；清醒时间中超过一半卧床或坐椅。</span></label>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="4" required><span class="dr-grade-number">4 分</span><span class="dr-grade-description">完全不能自理，整日卧床或坐椅。</span></label>
            <label class="dr-grade"><input type="radio" name="ecogGrade" value="5" required><span class="dr-grade-number">5 分</span><span class="dr-grade-description">死亡。</span></label>
            <p class="dr-field-help">分级依据：<a href="https://ecog-acrin.org/resources/ecog-performance-status/" target="_blank" rel="noopener noreferrer">ECOG Performance Status Scale · ECOG-ACRIN</a></p>
          </fieldset>
          <p class="dr-error" role="alert" data-error hidden></p>
          <div class="dr-form-actions"><button class="dr-button" type="button" data-form-secondary>返回列表</button><button class="dr-button dr-button-primary" type="button" data-save><i data-lucide="check" aria-hidden="true"></i><span data-submit-label>保存记录</span></button></div>
        </form>
        <aside class="dr-existing" data-existing-records aria-live="polite" aria-labelledby="dr-existing-heading"></aside>
        </div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const root = document.getElementById('daily-records-prototype');
      const find = (selector) => root.querySelector(selector);
      const pad = (value) => String(value).padStart(2, '0');
      const key = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      const deviceTime = () => { const date = new Date(); return `${key(date)}T${pad(date.getHours())}:${pad(date.getMinutes())}`; };
      const dateOf = (value) => { const [year, month, day] = value.split('-').map(Number); return new Date(year, month - 1, day, 12); };
      const dateLabel = (value) => { const date = dateOf(value); return `${date.getMonth() + 1}月${date.getDate()}日`; };
      const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
      const types = { weight: { label: '体重', icon: 'scale', units: ['kg', 'g', 'lb'], placeholder: '例如 62.4' }, temperature: { label: '体温', icon: 'thermometer', units: ['°C', '°F'], placeholder: '例如 36.7' }, symptom: { label: '症状', icon: 'activity', units: [] }, ecog: { label: 'ECOG评分', icon: 'clipboard-list', units: [] } };
      const now = new Date();
      const today = key(now);
      const state = { year: now.getFullYear(), month: now.getMonth(), selected: today, view: 'calendar', filter: 'all', kind: 'weight', saved: null, editing: null, expanded: null };
      const design = { calendarSummary: 'types' };
      let counter = 0;
      const records = [];
      function seed(daysAgo, time, kind, value, unit = '', severity = '') { const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysAgo, 12); records.push({ id: `sample-${++counter}`, date: key(day), time, kind, value, unit, severity }); }
      seed(0, '07:30', 'weight', '62.4', 'kg'); seed(0, '08:10', 'temperature', '36.7', '°C'); seed(0, '10:20', 'symptom', '乏力', '', '轻微');
      seed(0, '', 'ecog', '1', '分');
      seed(1, '07:45', 'weight', '62.6', 'kg'); seed(1, '20:30', 'temperature', '36.6', '°C');
      seed(2, '08:00', 'temperature', '36.5', '°C'); seed(2, '19:00', 'temperature', '36.8', '°C');
      seed(4, '07:40', 'weight', '62.8', 'kg'); seed(4, '14:10', 'symptom', '头痛', '', '轻微');
      seed(6, '08:15', 'weight', '62.7', 'kg'); seed(8, '08:00', 'temperature', '36.6', '°C'); seed(10, '07:30', 'weight', '62.9', 'kg'); seed(12, '09:20', 'symptom', '咳嗽', '', '偶尔');
      const drafts = { weight: { value: '', unit: 'kg' }, temperature: { value: '', unit: '°C' }, symptom: { value: '', severity: '' }, ecog: { value: '', unit: '分' } };
      let entryBeforeEdit = null;
      let pendingDeleteId = null;
      const icons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18, height: 18 } }); };
      const filtered = () => records.filter((record) => state.filter === 'all' || record.kind === state.filter);
      const onDate = (date) => filtered().filter((record) => record.date === date).sort((a, b) => b.time.localeCompare(a.time));
      const monthKey = () => `${state.year}-${pad(state.month + 1)}`;
      function recordMarkup(record) {
        const type = types[record.kind];
        const expanded = state.expanded === record.id;
        return `<article class="dr-record" data-record-id="${record.id}"><button class="dr-record-button" type="button" data-record="${record.id}" aria-expanded="${expanded}"><span class="dr-kind-icon"><i data-lucide="${type.icon}" aria-hidden="true"></i></span><span class="dr-record-content"><span class="dr-record-meta"><span>${type.label}</span>${record.time ? `<span>${record.time}</span>` : ''}${state.saved === record.id ? '<span class="dr-just-saved">✓ 刚刚保存</span>' : ''}</span><span class="dr-record-value">${escape(record.value)}${record.unit ? `<span class="dr-unit">${escape(record.unit)}</span>` : ''}${record.severity ? `<span class="dr-record-severity">${escape(record.severity)}</span>` : ''}</span></span><span class="dr-chevron"><i data-lucide="${expanded ? 'chevron-down' : 'chevron-right'}" aria-hidden="true"></i></span></button>${expanded ? `<div class="dr-record-expanded"><p>${record.date}${record.time ? ' ' + record.time : ''}</p><button class="dr-button dr-button-text" type="button" data-edit="${record.id}">更正记录</button></div>` : ''}</article>`;
      }
      function renderCalendar() {
        find('[data-calendar]').dataset.summary = design.calendarSummary;
        const first = new Date(state.year, state.month, 1, 12);
        const offset = (first.getDay() + 6) % 7;
        const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
        const cellCount = Math.ceil((offset + daysInMonth) / 7) * 7;
        let html = '';
        for (let cell = 0; cell < cellCount; cell += 1) {
          const date = new Date(state.year, state.month, cell - offset + 1, 12);
          const dateKey = key(date);
          const items = onDate(dateKey);
          const summaries = Object.entries(types).map(([kind, type]) => { const count = items.filter((item) => item.kind === kind).length; return count ? `${kind === 'ecog' ? 'ECOG' : type.label} ${count}` : ''; }).filter(Boolean);
          html += `<button class="dr-day${date.getMonth() !== state.month ? ' dr-other-month' : ''}${dateKey === today ? ' dr-today' : ''}" type="button" data-date="${dateKey}" aria-pressed="${dateKey === state.selected}"${dateKey === today ? ' aria-current="date"' : ''} aria-label="${dateKey}${dateKey === today ? '，今天' : ''}，${items.length ? `${items.length} 条记录，${summaries.join('，')}` : '暂无记录'}"><span class="dr-day-number">${date.getDate()}</span>${items.length ? `<span class="dr-summary">${summaries.join('<br>')}</span><span class="dr-total">${items.length} 条</span>` : ''}</button>`;
        }
        find('[data-days]').innerHTML = html;
        find('[data-month-count]').textContent = `本月 ${filtered().filter((record) => record.date.startsWith(monthKey())).length} 条`;
        const items = onDate(state.selected);
        const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dateOf(state.selected).getDay()];
        find('[data-day-panel]').innerHTML = `<div class="dr-panel-head"><h2>${dateLabel(state.selected)} <span class="dr-muted">${state.selected === today ? '今天' : week}</span></h2><span class="dr-muted">${items.length} 条记录</span></div>${items.length ? items.map(recordMarkup).join('') : `<div class="dr-empty"><i data-lucide="calendar" aria-hidden="true"></i><p>${state.filter === 'all' ? '这一天还没有记录' : `这一天没有${types[state.filter].label}记录`}</p></div>`}<p class="dr-day-footer">${items.length ? '点击记录可查看详情或更正。' : '可以选择其他日期查看。'}</p>`;
      }
      function renderList() {
        const items = filtered().filter((record) => record.date.startsWith(monthKey()));
        const dates = [...new Set(items.map((record) => record.date))].sort().reverse();
        find('[data-list-view]').innerHTML = dates.length ? dates.map((date) => `<section class="dr-list-group"><h3>${dateLabel(date)}${date === today ? ' · 今天' : ''}<span class="dr-muted">${onDate(date).length} 条记录</span></h3>${onDate(date).map(recordMarkup).join('')}</section>`).join('') : '<div class="dr-empty"><i data-lucide="notebook" aria-hidden="true"></i><p>这个月还没有符合条件的记录</p></div>';
      }
      function renderBrowse() {
        find('[data-month-title]').textContent = `${state.year}年${state.month + 1}月`;
        root.querySelectorAll('[data-view]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === state.view)));
        find('[data-calendar-view]').hidden = state.view !== 'calendar';
        find('[data-list-view]').hidden = state.view !== 'list';
        renderCalendar(); renderList(); icons();
      }
      function rememberDraft() {
        if (state.kind === 'symptom') drafts.symptom = { value: find('#dr-symptom').value, severity: find('#dr-severity').value };
        else if (state.kind === 'ecog') drafts.ecog = { value: find('[name="ecogGrade"]:checked')?.value || '', unit: '分' };
        else drafts[state.kind] = { value: find('#dr-value').value, unit: find('#dr-unit').value };
      }
      function renderExistingRecords() {
        const date = state.kind === 'ecog' ? find('#dr-date').value : find('#dr-time').value.slice(0, 10);
        const label = types[state.kind].label;
        const heading = `<h2 id="dr-existing-heading">当天已记录 · ${label}</h2>`;
        if (!date) {
          find('[data-existing-records]').innerHTML = heading + '<p class="dr-existing-empty">请选择日期，查看当天已记录内容。</p>';
          return;
        }
        const items = records.filter((record) => record.kind === state.kind && record.date === date).sort((a, b) => b.time.localeCompare(a.time));
        const [year, month, day] = date.split('-');
        const contents = items.map((record) => {
          const confirmation = pendingDeleteId === record.id ? `<div class="dr-delete-confirm" data-delete-confirmation role="group" aria-label="删除确认"><p>确认删除这条${types[record.kind].label}记录？</p><p class="dr-delete-detail">${record.date}${record.time ? ' ' + record.time : ''}<br>${escape(record.value)}${record.unit ? ' ' + escape(record.unit) : ''}${record.severity ? ' · ' + escape(record.severity) : ''}</p><div class="dr-row-actions"><button class="dr-button" type="button" data-cancel-delete>取消</button><button class="dr-button dr-button-danger" type="button" data-confirm-delete="${record.id}">确认删除</button></div></div>` : `<div class="dr-row-actions"><button class="dr-row-action" type="button" data-edit="${record.id}"${record.id === state.editing ? ' disabled' : ''}>更正</button><button class="dr-row-action dr-delete-action" type="button" data-delete="${record.id}">删除</button></div>`;
          return `<li data-existing-record="${record.id}"><div class="dr-existing-line">${record.time ? `<time class="dr-existing-time" datetime="${record.date}T${record.time}">${record.time}</time>` : ''}<span class="dr-existing-result">${escape(record.value)}${record.unit ? ' ' + escape(record.unit) : ''}${record.severity ? ' · ' + escape(record.severity) : ''}</span>${record.id === state.editing ? '<span class="dr-existing-status">正在更正</span>' : record.id === state.saved ? '<span class="dr-existing-status">✓ 刚刚保存</span>' : ''}</div>${confirmation}</li>`;
        }).join('');
        find('[data-existing-records]').innerHTML = `<div class="dr-existing-head">${heading}<span class="dr-muted">${items.length} 条</span></div><p class="dr-muted">${year}年${Number(month)}月${Number(day)}日${date === key(new Date()) ? ' · 今天' : ''}</p>${items.length ? `<ul class="dr-existing-list">${contents}</ul>` : `<p class="dr-existing-empty">当天还没有${label}记录。</p>`}`;
      }
      function renderForm() {
        const symptom = state.kind === 'symptom';
        const ecog = state.kind === 'ecog';
        const quantity = !symptom && !ecog;
        find('[data-form-title]').textContent = state.editing ? `更正${types[state.kind].label}记录` : '记一条';
        find('[data-form-subtitle]').textContent = state.editing ? '正在更正已有记录，保存后直接更新这条记录。' : '记录此刻，也可以补记之前的情况。';
        find('[data-submit-label]').textContent = state.editing ? '保存更正' : '保存记录';
        find('[data-form-secondary]').textContent = state.editing ? '取消更正' : '返回列表';
        root.querySelectorAll('[data-kind]').forEach((button) => { button.setAttribute('aria-pressed', String(button.dataset.kind === state.kind)); button.disabled = Boolean(state.editing) && button.dataset.kind !== state.kind; });
        find('[data-quantity-field]').hidden = !quantity;
        find('[data-symptom-fields]').hidden = !symptom;
        find('[data-ecog-fields]').hidden = !ecog; find('[data-ecog-fields]').disabled = !ecog;
        find('[data-date-field]').hidden = !ecog; find('#dr-date').disabled = !ecog; find('#dr-date').required = ecog;
        find('[data-time-field]').hidden = ecog; find('#dr-time').disabled = ecog; find('#dr-time').required = !ecog;
        find('#dr-value').disabled = !quantity; find('#dr-value').required = quantity; find('#dr-unit').disabled = !quantity;
        find('#dr-symptom').disabled = !symptom; find('#dr-symptom').required = symptom; find('#dr-severity').disabled = !symptom;
        find('label[for="dr-time"]').textContent = symptom ? '发生时间' : '测量时间';
        if (symptom) { find('#dr-symptom').value = drafts.symptom.value; find('#dr-severity').value = drafts.symptom.severity; }
        else if (ecog) root.querySelectorAll('[name="ecogGrade"]').forEach((input) => { input.checked = input.value === drafts.ecog.value; });
        else { find('[data-value-label]').textContent = types[state.kind].label; find('#dr-value').placeholder = types[state.kind].placeholder; find('#dr-value').value = drafts[state.kind].value; find('#dr-unit').innerHTML = types[state.kind].units.map((unit) => `<option>${unit}</option>`).join(''); find('#dr-unit').value = drafts[state.kind].unit; }
        find('[data-error]').hidden = true;
        renderExistingRecords();
        icons();
      }
      function openForm(record = null, fromSidebar = false) {
        pendingDeleteId = null;
        if (fromSidebar && !state.editing) {
          rememberDraft();
          entryBeforeEdit = { kind: state.kind, time: find('#dr-time').value, date: find('#dr-date').value, drafts: Object.fromEntries(Object.entries(drafts).map(([kind, draft]) => [kind, { ...draft }])) };
        } else if (!fromSidebar) entryBeforeEdit = null;
        find('[data-form-notice]').hidden = true;
        state.editing = record ? record.id : null;
        state.kind = record ? record.kind : 'weight';
        drafts.weight = { value: '', unit: 'kg' }; drafts.temperature = { value: '', unit: '°C' }; drafts.symptom = { value: '', severity: '' }; drafts.ecog = { value: '', unit: '分' };
        if (record) drafts[record.kind] = { value: record.value, unit: record.unit, severity: record.severity };
        find('#dr-time').value = record && record.time ? `${record.date}T${record.time}` : deviceTime();
        find('#dr-date').value = record ? record.date : key(new Date());
        find('#dr-time-help').textContent = record ? '按你填写的日期和时间保存。' : '默认当前设备时间，可修改。';
        find('#dr-date-help').textContent = record ? '按你填写的日期保存。' : '默认当前设备日期，可修改。';
        find('[data-screen="browse"]').hidden = true; find('[data-screen="form"]').hidden = false;
        renderForm(); find('[data-kind="' + state.kind + '"]').focus();
      }
      function finishEditing() {
        pendingDeleteId = null;
        state.editing = null;
        if (entryBeforeEdit) {
          state.kind = entryBeforeEdit.kind;
          Object.assign(drafts, entryBeforeEdit.drafts);
          find('#dr-time').value = entryBeforeEdit.time;
          find('#dr-date').value = entryBeforeEdit.date;
        } else {
          drafts[state.kind] = { ...drafts[state.kind], value: '', severity: '' };
          find('#dr-time').value = deviceTime();
          find('#dr-date').value = key(new Date());
        }
        entryBeforeEdit = null;
        find('#dr-time-help').textContent = '默认当前设备时间，可修改。';
        find('#dr-date-help').textContent = '默认当前设备日期，可修改。';
        find('[data-form-notice]').hidden = true;
        renderForm();
        find(state.kind === 'symptom' ? '#dr-symptom' : state.kind === 'ecog' ? '#dr-date' : '#dr-value').focus();
      }
      function deleteRecord(id) {
        if (pendingDeleteId !== id) return;
        const position = records.findIndex((record) => record.id === id);
        if (position < 0) return;
        pendingDeleteId = null;
        records.splice(position, 1);
        if (state.saved === id) state.saved = null;
        find('[data-form-notice]').hidden = true;
        find('[data-notice]').hidden = true;
        if (state.editing === id) finishEditing();
        else renderExistingRecords();
        find('[data-form-notice]').textContent = '已删除记录。';
        find('[data-form-notice]').hidden = false;
        find(state.kind === 'symptom' ? '#dr-symptom' : state.kind === 'ecog' ? '#dr-date' : '#dr-value').focus();
      }
      function closeForm() { entryBeforeEdit = null; pendingDeleteId = null; state.editing = null; find('[data-screen="form"]').hidden = true; find('[data-screen="browse"]').hidden = false; renderBrowse(); find('[data-action="new"]').focus(); }
      root.addEventListener('click', (event) => {
        const button = event.target.closest('button'); if (!button || !root.contains(button)) return;
        if (button.dataset.view) { state.view = button.dataset.view; renderBrowse(); }
        else if (button.dataset.date) { state.selected = button.dataset.date; state.expanded = null; const date = dateOf(state.selected); state.year = date.getFullYear(); state.month = date.getMonth(); renderBrowse(); const selected = find(`[data-date="${state.selected}"]`); if (selected) selected.focus(); }
        else if (button.dataset.kind) { pendingDeleteId = null; rememberDraft(); state.kind = button.dataset.kind; renderForm(); }
        else if (button.dataset.record) { state.expanded = state.expanded === button.dataset.record ? null : button.dataset.record; renderBrowse(); const container = find(state.view === 'calendar' ? '[data-day-panel]' : '[data-list-view]'); container.querySelector(`[data-record="${button.dataset.record}"]`).focus(); }
        else if (button.dataset.edit) openForm(records.find((record) => record.id === button.dataset.edit), Boolean(button.closest('[data-existing-records]')));
        else if (button.dataset.delete) { pendingDeleteId = button.dataset.delete; renderExistingRecords(); find('[data-cancel-delete]').focus(); }
        else if (button.hasAttribute('data-cancel-delete')) { const id = pendingDeleteId; pendingDeleteId = null; renderExistingRecords(); find(`[data-delete="${id}"]`)?.focus(); }
        else if (button.dataset.confirmDelete) deleteRecord(button.dataset.confirmDelete);
        else if (button.dataset.action === 'new') openForm();
        else if (button.dataset.action === 'cancel') closeForm();
        else if (button.dataset.action === 'today') { const date = new Date(); state.year = date.getFullYear(); state.month = date.getMonth(); state.selected = key(date); state.expanded = null; renderBrowse(); }
        else if (button.dataset.action === 'previous' || button.dataset.action === 'next') { const date = new Date(state.year, state.month + (button.dataset.action === 'next' ? 1 : -1), 1, 12); state.year = date.getFullYear(); state.month = date.getMonth(); state.selected = state.year === now.getFullYear() && state.month === now.getMonth() ? today : key(date); state.expanded = null; renderBrowse(); }
      });
      find('[data-filter]').addEventListener('change', (event) => { state.filter = event.target.value; state.expanded = null; renderBrowse(); });
      function saveRecord() {
        const form = find('[data-record-form]'); if (!form.reportValidity()) return;
        pendingDeleteId = null;
        const wasEditing = Boolean(state.editing);
        rememberDraft();
        const draft = drafts[state.kind];
        const value = draft.value.trim();
        if (!value || (state.kind !== 'symptom' && !Number.isFinite(Number(value)))) { find('[data-error]').textContent = state.kind === 'symptom' ? '请填写症状名称。' : '请填写有效数值。'; find('[data-error]').hidden = false; return; }
        const [date, time] = state.kind === 'ecog' ? [find('#dr-date').value, ''] : find('#dr-time').value.split('T');
        const record = { id: state.editing || `new-${++counter}`, date, time: time.slice(0, 5), kind: state.kind, value, unit: state.kind === 'symptom' ? '' : draft.unit, severity: state.kind === 'symptom' ? draft.severity.trim() : '' };
        const position = records.findIndex((item) => item.id === state.editing);
        if (position >= 0) records[position] = record; else records.push(record);
        const dateParts = date.split('-').map(Number); state.year = dateParts[0]; state.month = dateParts[1] - 1; state.selected = date; state.saved = record.id; state.expanded = null; state.filter = 'all'; find('[data-filter]').value = 'all';
        const confirmation = `✓ ${state.editing ? '已保存更正' : '已保存'} · ${types[state.kind].label} ${value}${record.unit ? ' ' + record.unit : ''} · ${dateLabel(date)}${record.time ? ' ' + record.time : ''}`;
        if (wasEditing) finishEditing();
        else {
          drafts[state.kind] = { ...draft, value: '', severity: '' };
          find('#dr-time').value = deviceTime();
          find('#dr-date').value = key(new Date());
          renderForm();
        }
        find('[data-notice]').textContent = confirmation;
        find('[data-notice]').hidden = false;
        find('[data-form-notice]').textContent = confirmation + '。可继续添加下一条。';
        find('[data-form-notice]').hidden = false;
        find(state.kind === 'symptom' ? '#dr-symptom' : state.kind === 'ecog' ? '#dr-date' : '#dr-value').focus();
      }
      find('[data-save]').addEventListener('click', saveRecord);
      find('[data-form-secondary]').addEventListener('click', () => { if (state.editing) finishEditing(); else closeForm(); });
      find('#dr-time').addEventListener('input', () => { pendingDeleteId = null; renderExistingRecords(); });
      find('#dr-date').addEventListener('input', () => { pendingDeleteId = null; renderExistingRecords(); });
      find('[data-record-form]').addEventListener('submit', (event) => { event.preventDefault(); saveRecord(); });
      find('[data-record-form]').addEventListener('keydown', (event) => { if (event.key === 'Enter' && event.target.tagName === 'INPUT') { event.preventDefault(); saveRecord(); } });
      renderBrowse();
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({ container: find('[data-calendar]'), onChange: renderBrowse });
        tweak.addSelect(design, 'calendarSummary', { label: '日期格内容', options: [{ label: '类型与数量', value: 'types' }, { label: '仅记录数量', value: 'count' }] });
      }
    })();
  </script>
</div>
