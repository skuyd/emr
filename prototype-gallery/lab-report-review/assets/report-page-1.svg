  <rect x="68" y="478" width="864" height="54" fill="#e8f0ef"/>
  <rect x="68" y="478" width="7" height="54" fill="#3d7681"/>
  <text x="90" y="513" class="heading">一、血常规</text>
  <text x="912" y="511" text-anchor="end" class="small muted">本页 4 项</text>
  <rect x="68" y="545" width="864" height="58" fill="#eef2f1"/>
