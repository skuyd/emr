<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-label="合成演示检验报告第一页，血常规四项">
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset=".54" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f5f4ef"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#466170" stroke-opacity=".027" stroke-width=".5"/></pattern>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#334450}
      .small{font-size:21px;letter-spacing:1px}.meta{font-size:24px}.heading{font-size:26px;font-weight:700}
      .cell{font-size:27px}.value{font-size:30px;font-weight:700}.muted{fill:#657985}
      .line{stroke:#bbc9cc;stroke-width:1.5}.col{stroke:#d6dfe0;stroke-width:1}
    </style>
  </defs>
  <rect width="1000" height="1400" fill="url(#paper)"/>
  <rect width="1000" height="1400" fill="url(#scan)"/>
  <rect x="23" y="22" width="954" height="1356" fill="none" stroke="#d9deda" stroke-width="2"/>
  <path d="M67 78h23m-11-11v23" stroke="#3d7681" stroke-width="5" stroke-linecap="round"/>
