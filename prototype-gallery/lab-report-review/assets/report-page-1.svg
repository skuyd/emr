  <text x="473" y="808" class="value">138</text><text x="605" y="808" class="small">g/L</text>
  <text x="743" y="808" class="small">115–150</text><text x="898" y="808" text-anchor="middle" class="cell">—</text>
  <text x="90" y="886" class="cell">血小板计数 <tspan class="muted" font-size="21">PLT</tspan></text>
  <text x="473" y="886" class="value">220</text><text x="605" y="886" class="small">×10⁹/L</text>
  <text x="743" y="886" class="small">125–350</text><text x="898" y="886" text-anchor="middle" class="cell">—</text>

