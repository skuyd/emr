  <path d="M448 545V915M587 545V915M726 545V915M866 545V915" class="col"/>
  <rect x="69" y="604" width="862" height="76" fill="#fdfdfa"/>
  <rect x="69" y="760" width="862" height="76" fill="#fdfdfa"/>
