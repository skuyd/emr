  <text x="500" y="248" text-anchor="middle" font-size="22" class="muted">血常规 · 第 1 页 / 共 2 页</text>
  <rect x="68" y="284" width="864" height="170" fill="#fbfcfa" stroke="#cad5d5" stroke-width="1.5"/>
  <path d="M68 340H932M68 397H932M500 284V454" class="line"/>
  <text x="90" y="322" class="meta muted">报告编号</text><text x="220" y="322" class="meta">DEMO-LAB-2609-018</text>
  <text x="522" y="322" class="meta muted">样本身份</text><text x="654" y="322" class="meta">演示样本</text>
  <text x="90" y="379" class="meta muted">采样时间</text><text x="220" y="379" class="meta">2026-09-27 08:40</text>
