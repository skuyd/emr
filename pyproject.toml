[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "family-phr"
version = "1.15.0" # x-release-please-version
requires-python = ">=3.11,<3.15"
dependencies = [
  "Django>=5.2.12,<5.3",
  "celery>=5.6.3,<5.7",
  "redis>=5.2,<7",
  "psycopg[binary]>=3.2,<3.4",
  "django-environ>=0.12,<0.13",
  "django-redis>=5.4,<6",
  "django-storages[s3]>=1.14,<2",
  "boto3>=1.35,<2",
  "cryptography>=47,<51",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "Pillow>=11,<13",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
  "pillow-heif>=1,<2",
  "pypdf>=6.16,<7",
  "pypdfium2>=5.13,<6",
  "reportlab>=4.4,<5",
  "magika>=0.6,<1",
  "pywebpush>=2.5,<3",
  "idna>=3.11,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "freezegun>=1.5,<2",
  "playwright>=1.52,<2",
  "PyYAML>=6.0,<7",
]
ocr = [
  "paddleocr>=3.7,<3.8",
  "paddlepaddle>=3.3,<3.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
markers = [
  "postgres: requires the disposable PostgreSQL integration database",
  "ocr_model: requires the prepared local PaddleOCR model environment",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*", "tools*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"apps.labs" = ["dictionaries/*.json"]
