[project]
name = "family-phr"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Django>=5.2.12,<5.3",
  "celery>=5.6.3,<5.7",
  "redis>=5.2,<7",
  "psycopg[binary]>=3.2,<3.4",
  "django-environ>=0.12,<0.13",
  "django-redis>=5.4,<6",
  "django-storages[s3]>=1.14,<2",
  "boto3>=1.35,<2",
  "cryptography>=44,<47",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "Pillow>=11,<13",
  "pillow-heif>=1,<2",
  "pypdf>=6.16,<7",
  "pypdfium2>=5.13,<6",
  "magika>=0.6,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "freezegun>=1.5,<2",
  "playwright>=1.52,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
